<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Netflix Clone</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
</head>

<body>

<!-- NAVBAR -->

<header>

<nav>

<div class="logo">

<img src="images/logo.png">

</div>

<ul>

<li>Home</li>

<li>TV Shows</li>

<li>Movies</li>

<li>New & Popular</li>

<li>My List</li>

</ul>

<div class="right">

<i class="fa-solid fa-magnifying-glass"></i>

<i class="fa-solid fa-bell"></i>

<img src="images/profile.png">

</div>

</nav>

</header>

<!-- HERO -->

<section class="hero">

<div class="overlay">

<h1>Money Heist</h1>

<p>

To carry out the biggest heist in history,
a mysterious man called The Professor
recruits eight robbers.

</p>

<div class="buttons">

<button class="play">

<i class="fa-solid fa-play"></i>

Play

</button>

<button class="info">

More Info

</button>

</div>

</div>

</section>

<!-- TRENDING -->

<section class="movies">

<h2>Trending Now</h2>

<div class="row">

<img src="images/movie1.jpg">

<img src="images/movie2.jpg">

<img src="images/movie3.jpg">

<img src="images/movie4.jpg">

<img src="images/movie5.jpg">

<img src="images/movie6.jpg">

</div>

</section>

<!-- POPULAR -->

<section class="movies">

<h2>Popular on Netflix</h2>

<div class="row">

<img src="images/movie7.jpg">

<img src="images/movie8.jpg">

<img src="images/movie9.jpg">

<img src="images/movie10.jpg">

<img src="images/movie11.jpg">

<img src="images/movie12.jpg">

</div>

</section>

<!-- ACTION -->

<section class="movies">

<h2>Action Movies</h2>

<div class="row">

<img src="images/movie13.jpg">

<img src="images/movie14.jpg">

<img src="images/movie15.jpg">

<img src="images/movie16.jpg">

<img src="images/movie17.jpg">

<img src="images/movie18.jpg">

</div>

</section>

<footer>

<p>

Netflix Clone © 2026

</p>

</footer>

<script src="netflix.js"></script>

</body>

</html>
